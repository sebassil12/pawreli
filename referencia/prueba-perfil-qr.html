<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>¿Encontraste a Luna?</title>
<style>
  /* ---------------------------------------------------------------
     PRUEBA — página de perfil de mascota Pawreli
     Sin JavaScript. Sin fuentes externas. Sin requests fuera del dominio.
     Para probar: cambia los datos marcados con  <<<  EDITAR
     --------------------------------------------------------------- */
  :root{
    --ink:#15302A;
    --ink-muted:#4A6B63;
    --teal:#1B6560;
    --peach:#C4854F;
    --line:#DCE6E3;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit}
  body{
    margin:0;
    background:#fff;
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:430px;margin:0 auto;padding:20px 18px 40px}
  h1{
    font-size:30px;line-height:1.15;margin:8px 0 18px;
    font-weight:800;letter-spacing:-.02em;
  }
  .foto{
    width:100%;aspect-ratio:4/3;object-fit:cover;
    border-radius:14px;background:var(--line);display:block;
  }
  .datos{margin:16px 0 22px}
  .nombre{font-size:26px;font-weight:700;margin:0}
  .raza{font-size:17px;color:var(--ink-muted);margin:4px 0 0}
  .btn{
    display:flex;align-items:center;justify-content:center;
    width:100%;min-height:62px;padding:16px;
    background:var(--teal);color:#fff;
    font-size:19px;font-weight:700;line-height:1.25;text-align:center;
    text-decoration:none;border-radius:12px;
  }
  .tel{
    display:block;width:100%;min-height:56px;
    margin-top:12px;padding:16px;
    border:2px solid var(--teal);border-radius:12px;
    color:var(--teal);font-size:18px;font-weight:600;
    text-align:center;text-decoration:none;
  }
  .nota{
    margin-top:24px;padding:14px 16px;
    background:#FBF5EC;border-left:4px solid var(--peach);
    border-radius:0 8px 8px 0;
    font-size:16px;line-height:1.5;
  }
  .codigo{
    margin-top:28px;padding-top:18px;border-top:1px solid var(--line);
    font-size:14px;color:var(--ink-muted);
  }
  .codigo b{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:16px;color:var(--ink);letter-spacing:.05em}
  footer{margin-top:22px;font-size:13px;color:var(--ink-muted)}
  footer a{color:var(--ink-muted)}
</style>
</head>
<body>
<div class="wrap">

  <h1>¿Encontraste a Luna?</h1>

  <!-- <<< EDITAR: reemplaza por una foto real, o deja el placeholder gris -->
  <img class="foto" src="luna.jpg" alt="Luna">

  <div class="datos">
    <p class="nombre">Luna</p>
    <p class="raza">Golden Retriever</p>
  </div>

  <!-- <<< EDITAR: pon tu número real con código de país, sin + ni espacios -->
  <a class="btn" href="https://wa.me/593999999999?text=%C2%A1Hola!%20Encontr%C3%A9%20a%20Luna%20%F0%9F%90%BE">
    Avisar a María por WhatsApp
  </a>

  <!-- <<< EDITAR: el mismo número -->
  <a class="tel" href="tel:+593999999999">o llamar al 099 999 9999</a>

  <p class="nota">Es muy nerviosa con desconocidos, háblale despacio.</p>

  <p class="codigo">Código de la placa: <b>A7K9-X2M4</b></p>

  <footer>Placa <a href="https://pawreli.com">Pawreli</a></footer>

</div>
</body>
</html>
