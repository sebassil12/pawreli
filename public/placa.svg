<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 560" width="520" height="560" role="img" aria-label="Plaquita QR Pawreli con el nombre de la mascota">
  <defs>
    <filter id="tagShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1b6560" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="tagFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4faf8"/>
    </linearGradient>
  </defs>

  <g filter="url(#tagShadow)">
    <!-- Tag body with integrated hole -->
    <rect x="130" y="70" width="260" height="420" rx="46" fill="url(#tagFace)" stroke="#2e9e96" stroke-width="6"/>
    <!-- Ring hole -->
    <circle cx="260" cy="118" r="17" fill="none" stroke="#1b6560" stroke-width="7"/>

    <!-- QR -->
    <rect x="180" y="168" width="160" height="160" rx="12" fill="#15302a"/>
    <g fill="#ffffff">
      <rect x="196" y="184" width="36" height="36" rx="4"/>
      <rect x="288" y="184" width="36" height="36" rx="4"/>
      <rect x="196" y="276" width="36" height="36" rx="4"/>
      <rect x="248" y="236" width="22" height="22"/>
      <rect x="288" y="276" width="18" height="18"/>
      <rect x="308" y="296" width="14" height="14"/>
      <rect x="288" y="236" width="12" height="12"/>
    </g>

    <!-- Name + wordmark -->
    <text x="260" y="386" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="800" fill="#15302a" letter-spacing="-0.5">Luna</text>
    <text x="260" y="440" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#2e9e96" letter-spacing="0.5">Pawreli</text>
  </g>
</svg>
